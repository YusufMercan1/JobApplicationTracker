<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="welcome-text">
      <h1>Mina Jobbansökningar</h1>
      <p>Välkommen, <strong>{{ currentUser }}</strong>!</p>
    </div>

    <div class="header-actions">
      <button routerLink="/add-application" class="btn-add">+ Lägg till ansökan</button>
      <button class="btn-logout" (click)="logout()">Logga ut</button>
    </div>
  </header>

  <div *ngIf="errorMessage" class="error-banner">
    {{ errorMessage }}
  </div>

  <div class="stats-cards">
    <div class="card">
      <h3>Totalt sökta</h3>
      <p class="stat-number">{{ applications.length }}</p>
    </div>
  </div>

  <div class="table-responsive">
    <table class="job-table">
      <thead>
      <tr>
        <th>Företag</th>
        <th>Roll</th>
        <th>Status</th>
        <th>Datum</th>
        <th>Åtgärder</th> </tr>
      </thead>
      <tbody>
      <tr *ngFor="let app of applications">
        <td>{{ app.companyName }}</td>
        <td>{{ app.jobTitle }}</td>
        <td>
          <select
            [(ngModel)]="app.status"
            (change)="onStatusChange(app.id, app.status)"
            [ngClass]="app.status.toLowerCase()"
            class="status-select">
            <option value="SÖKT">Sökt</option>
            <option value="INTERVJU">Intervju</option>
            <option value="ERBJUDANDE">Erbjudande</option>
            <option value="NEJ">Nej tack</option>
          </select>
        </td>
        <td>{{ app.applicationDate | date:'yyyy-MM-dd' }}</td>
        <td>
          <button (click)="onDelete(app.id)" class="btn-delete">
            Radera
          </button>
        </td>
      </tr>

      <tr *ngIf="applications.length === 0 && !errorMessage">
        <td colspan="5" class="empty-msg">Inga ansökningar hittades. Dags att söka jobb!</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
