<div class="register-container">
  <h2>Skapa konto</h2>

  <div class="form-group">
    <label>Användarnamn</label>
    <input [(ngModel)]="user.username" name="username" class="form-control">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input [(ngModel)]="user.email" name="email" type="email" class="form-control">
  </div>

  <div class="form-group">
    <label>Lösenord</label>
    <input [(ngModel)]="user.password" name="password" type="password" class="form-control">
  </div>

  <button (click)="onRegister()">Registrera dig</button>

  <p>Har du redan ett konto? <a routerLink="/login">Logga in här</a></p>
</div>
