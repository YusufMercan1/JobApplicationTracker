<div class="auth-page">
  <div class="auth-brand">
    <span class="brand-icon">JT</span>
    <h1>Job Tracker</h1>
    <p>Skapa konto och börja spåra dina ansökningar</p>
  </div>

  <div class="auth-card">
    <header class="auth-header">
      <h2>Skapa konto</h2>
      <p>Registrera dig gratis</p>
    </header>

    <div class="form-group">
      <label for="username">Användarnamn</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="user.username"
        name="username"
        placeholder="Välj användarnamn"
        autocomplete="username">
    </div>

    <div class="form-group">
      <label for="email">E-post</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="user.email"
        name="email"
        placeholder="din@email.se"
        autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Lösenord</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="user.password"
        name="password"
        placeholder="Välj lösenord"
        autocomplete="new-password"
        (keyup.enter)="onRegister()">
    </div>

    <button type="button" class="btn-primary" (click)="onRegister()">Registrera dig</button>

    <p class="auth-footer">
      Har du redan konto?
      <a routerLink="/login">Logga in</a>
    </p>
  </div>
</div>
