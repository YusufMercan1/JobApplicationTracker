<div class="auth-page">
  <div class="auth-brand">
    <span class="brand-icon">JT</span>
    <h1>Job Tracker</h1>
    <p>Håll koll på dina jobbansökningar</p>
  </div>

  <div class="auth-card">
    <header class="auth-header">
      <h2>Logga in</h2>
      <p>Välkommen tillbaka</p>
    </header>

    <div class="form-group">
      <label for="username">Användarnamn</label>
      <input
        type="text"
        id="username"
        [(ngModel)]="credentials.username"
        name="username"
        placeholder="Ditt användarnamn"
        autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Lösenord</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="credentials.password"
        name="password"
        placeholder="Ditt lösenord"
        autocomplete="current-password"
        (keyup.enter)="onLogin()">
    </div>

    <button type="button" class="btn-primary" (click)="onLogin()">Logga in</button>

    <p class="auth-footer">
      Saknar du konto?
      <a routerLink="/register">Registrera dig</a>
    </p>
  </div>
</div>
