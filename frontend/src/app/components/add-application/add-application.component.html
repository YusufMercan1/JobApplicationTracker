<div class="container">
  <h2>Lägg till ny jobbansökan</h2>
  <button routerLink="/add-application" class="btn-add">+ Lägg till ansökan</button>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Företag</label>
      <input type="text" [(ngModel)]="newApp.company" name="company" required>
    </div>

    <div class="form-group">
      <label>Roll</label>
      <input type="text" [(ngModel)]="newApp.role" name="role" required>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select [(ngModel)]="newApp.status" name="status">
        <option value="APPLIED">Sökt</option>
        <option value="INTERVIEW">Intervju</option>
        <option value="OFFER">Erbjudande</option>
        <option value="REJECTED">Nej tack</option>
      </select>
    </div>

    <div class="form-group">
      <label>Datum</label>
      <input type="date" [(ngModel)]="newApp.applicationDate" name="date">
    </div>

    <div class="button-group">
      <button type="submit" class="btn-save">Spara ansökan</button>
      <button type="button" (click)="cancel()" class="btn-cancel">Avbryt</button>
    </div>
  </form>
</div>
